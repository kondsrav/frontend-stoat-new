# Production Docker Compose for Stoat Frontend + Backend
version: '3.8'
services:
  frontend:
    image: kondsrav/stoat-frontend-prod:latest
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=https://stoat-dev.zasperhub.com/api
      - VITE_WS_URL=wss://stoat-dev.zasperhub.com/ws
      - VITE_MEDIA_URL=https://stoat-dev.zasperhub.com/autumn
      - VITE_PROXY_URL=https://stoat-dev.zasperhub.com/january
      - VITE_HCAPTCHA_SITEKEY=${VITE_HCAPTCHA_SITEKEY:-}
      - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # If you want to include backend in the same compose (optional)
  # backend:
  #   image: your-backend-image:latest
  #   ports:
  #     - "14702:14702"  # API
  #     - "14703:14703"  # WebSocket
  #     - "14704:14704"  # Media
  #     - "14705:14705"  # Proxy
  #   environment:
  #     - RUST_LOG=info
  #   networks:
  #     - stoat-network
  #   restart: unless-stopped

networks:
  stoat-network:
    driver: bridge
